<!-- XLOG intermediate representations. Source: docs/core-concepts/how-xlog-works.mdx. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Inter, system-ui, sans-serif">
  <rect width="960" height="360" fill="#0E0E16"/>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9B98B4"/>
    </marker>
  </defs>

  <text x="28" y="36" font-size="16" font-weight="600" fill="#E7E6F0">Intermediate representations</text>
  <text x="28" y="55" font-size="11" fill="#9B98B4">Three reasoning IRs fan out from the normalized AST; solver calls use a separate shared GpuCnf/CDCL service.</text>

  <rect x="28" y="155" width="120" height="50" rx="7" fill="#171626" stroke="#E7E6F0" stroke-width="1.25"/>
  <text x="88" y="177" text-anchor="middle" font-size="12.5" font-weight="600" fill="#E7E6F0">Normalized AST</text>
  <text x="88" y="192" text-anchor="middle" font-size="9.5" fill="#9B98B4">shared frontend</text>

  <g stroke="#9B98B4" stroke-width="1.5" fill="none" marker-end="url(#arrow-dark)">
    <path d="M148,177 C184,177 184,88 233,88"/>
    <path d="M148,179 C188,179 188,156 233,156"/>
    <path d="M148,181 C188,181 188,224 233,224"/>
  </g>

  <rect x="235" y="66" width="130" height="44" rx="7" fill="#171626" stroke="#E7E6F0" stroke-width="1.25"/>
  <rect x="236.5" y="68" width="3.5" height="40" rx="1.75" fill="#8B83F0"/>
  <text x="254" y="86" font-size="12" font-weight="600" fill="#E7E6F0">RIR</text>
  <text x="254" y="100" font-size="9.5" fill="#9B98B4">deterministic relational IR</text>

  <rect x="235" y="134" width="130" height="44" rx="7" fill="#171626" stroke="#E7E6F0" stroke-width="1.25"/>
  <rect x="236.5" y="136" width="3.5" height="40" rx="1.75" fill="#A78BFA"/>
  <text x="254" y="154" font-size="12" font-weight="600" fill="#E7E6F0">PIR</text>
  <text x="254" y="168" font-size="9.5" fill="#9B98B4">probabilistic provenance</text>

  <rect x="235" y="202" width="130" height="44" rx="7" fill="#171626" stroke="#E7E6F0" stroke-width="1.25"/>
  <rect x="236.5" y="204" width="3.5" height="40" rx="1.75" fill="#22D3EE"/>
  <text x="254" y="222" font-size="12" font-weight="600" fill="#E7E6F0">EIR</text>
  <text x="254" y="236" font-size="9.5" fill="#9B98B4">epistemic semantics</text>

  <g stroke="#9B98B4" stroke-width="1.5" fill="none" marker-end="url(#arrow-dark)">
    <path d="M365,88 H498"/>
    <path d="M365,156 H498"/>
    <path d="M365,224 H498"/>
  </g>

  <rect x="500" y="60" width="190" height="56" rx="7" fill="#1C1A33" stroke="#8B83F0" stroke-width="1.25"/>
  <rect x="512" y="68" width="38" height="14" rx="7" fill="#10B981"/>
  <text x="531" y="78" text-anchor="middle" font-size="8" font-weight="600" fill="#0E0E16" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace">GPU</text>
  <text x="595" y="94" text-anchor="middle" font-size="11.5" font-weight="600" fill="#E7E6F0">Relational plan</text>
  <text x="595" y="107" text-anchor="middle" font-size="9" fill="#9B98B4">joins · aggregates · fixpoints</text>

  <path d="M500,128 H678 L690,140 V176 H500 Z" fill="#1C1A33" stroke="#A78BFA" stroke-width="1.25"/>
  <text x="595" y="151" text-anchor="middle" font-size="11.5" font-weight="600" fill="#E7E6F0">XGCF</text>
  <text x="595" y="165" text-anchor="middle" font-size="9.5" fill="#9B98B4">GPU circuit format</text>

  <rect x="500" y="188" width="340" height="72" rx="7" fill="#102832" stroke="#22D3EE" stroke-width="1.25"/>
  <text x="516" y="207" font-size="11.5" font-weight="600" fill="#E7E6F0">Epistemic dispatch</text>
  <text x="516" y="222" font-size="9.5" fill="#9B98B4">acyclic modal program → Generate-Propagate-Test</text>
  <text x="516" y="237" font-size="9.5" fill="#9B98B4">positive cycle → FAEEL least / G91 tuple greatest fixpoint</text>
  <text x="516" y="252" font-size="9.5" fill="#9B98B4">supported negative cycle → GPU-backed WFS</text>

  <rect x="235" y="278" width="605" height="44" rx="7" fill="#2B2310" stroke="#FBBF24" stroke-width="1.25"/>
  <rect x="236.5" y="280" width="3.5" height="40" rx="1.75" fill="#FBBF24"/>
  <text x="254" y="296" font-size="11.5" font-weight="600" fill="#E7E6F0">Shared solver service</text>
  <text x="254" y="312" font-size="9.5" fill="#9B98B4" font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace">GpuCnf → CDCL · SAT/MaxSAT and verification</text>

  <text x="28" y="344" font-size="10.5" fill="#9B98B4">The frontend produces RIR, PIR, and EIR. The shared GpuCnf/CDCL service is not a fourth reasoning IR.</text>
</svg>
