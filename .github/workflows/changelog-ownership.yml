name: changelog-ownership

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  changelog-ownership:
    name: changelog-ownership
    runs-on: ubuntu-latest
    steps:
      - name: Require release ownership for generated changelog changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          files_json=$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100")
          if ! jq -e 'flatten | any(.filename == "CHANGELOG.md")' \
            <<< "$files_json" >/dev/null; then
            echo "CHANGELOG.md is unchanged."
            exit 0
          fi

          labels_json=$(jq -c '.pull_request.labels' "$GITHUB_EVENT_PATH")
          if jq -e 'map(.name) | index("release") != null' \
            <<< "$labels_json" >/dev/null; then
            echo "CHANGELOG.md change is owned by a release-labelled pull request."
            exit 0
          fi

          echo "CHANGELOG.md is generated by release-plz and may only change in a release-labelled pull request." >&2
          exit 1
