name: docs

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed main build to docs-dist
        type: boolean
        default: false

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Require main for publication
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [[ "$PUBLISH" == true && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "Documentation publication requires the reviewed main branch" >&2
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install Mintlify CLI (pinned)
        run: npm install -g mint@4.2.666
      - name: Generate Rust API docs
        run: bash scripts/docs/build_rust_api.sh
        env:
          XLOG_RUSTDOC_OUTPUT_DIR: ${{ github.workspace }}/.site-rustdoc/generated/rust
      - name: Validate
        working-directory: docs
        run: |
          mint validate
          mint broken-links
      - name: Export static bundle
        working-directory: docs
        run: |
          mint export
          mkdir -p ../.site-dist
          unzip -o export.zip -d ../.site-dist
      - name: Build self-hosted search index (Pagefind)
        run: |
          python3 scripts/docs/build_markdown_exports.py docs .site-dist
          python3 scripts/docs/inject_search_shim.py .site-dist
          npx -y pagefind@1.5.2 --site .site-dist
          test -f .site-dist/index.md
          test -f .site-dist/architecture/gpu-execution.md
          test -f .site-dist/pagefind/pagefind-ui.js
          test -f .site-dist/pagefind/pagefind-ui.css
      - name: Add legacy redirects and 404 page
        run: |
          python3 scripts/docs/build_redirect_stubs.py docs .site-dist
          test -f .site-dist/404.html
          test -f .site-dist/architecture/xlog-prob/index.html
      - name: Attach generated Rust API docs
        run: |
          rm -rf .site-dist/generated/rust
          mkdir -p .site-dist/generated
          cp -R .site-rustdoc/generated/rust .site-dist/generated/rust
      - name: Upload the built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: docs-site-${{ github.sha }}
          path: .site-dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: docs-dist
          path: docs-publication
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: docs-site-${{ github.sha }}
          path: ${{ runner.temp }}/docs-site
      - name: Publish an additive docs-dist commit
        working-directory: docs-publication
        run: |
          set -euo pipefail
          rsync -a --delete --exclude=.git "$RUNNER_TEMP/docs-site/" ./
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The published site is unchanged."
            exit 0
          fi
          git commit -m "docs: publish site build ${GITHUB_SHA}"
          git push origin HEAD:docs-dist
