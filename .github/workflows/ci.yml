name: ci

# Local validation:
#   make lint-workflows  # actionlint + shellcheck for workflow YAML and embedded bash
#   make lint-shell      # shellcheck for repo shell scripts
#   make check-tracked-ignored  # tracked files must not match .gitignore

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  production-build:
    name: production-build
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TARGET_DIR: target/source-checks
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Identify runner Rust toolchain
        id: rust
        run: |
          rust_version=$(rustc --version | cut -d ' ' -f 2)
          printf 'version=%s\n' "$rust_version" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/source-checks
          key: source-checks-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            source-checks-${{ runner.os }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
          ACTIONLINT_SHA256: 023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
        run: |
          set -euo pipefail
          actionlint_dir=$(mktemp -d)
          actionlint_archive="$actionlint_dir/actionlint.tar.gz"
          curl --fail --show-error --location \
            --retry 3 \
            --retry-all-errors \
            --output "$actionlint_archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$actionlint_archive" | sha256sum --check
          tar -xzf "$actionlint_archive" -C "$actionlint_dir" actionlint
          printf '%s\n' "$actionlint_dir" >> "$GITHUB_PATH"

      - name: Check source formatting, workflows and shell scripts
        run: |
          set -euo pipefail
          cargo fmt --all --check
          actionlint -color
          mapfile -d '' -t files < <(git ls-files -z -- 'scripts/*.sh' '.github/*.sh')
          if ((${#files[@]})); then
            shellcheck "${files[@]}"
          fi
          ignored=$(git ls-files -ci --exclude-standard)
          if [[ -n "$ignored" ]]; then
            printf 'Tracked files match ignore rules:\n%s\n' "$ignored" >&2
            exit 1
          fi

      # Keep the required status name stable; this is source acceptance only.
      # These libraries' default dependency closure contains no xlog-cuda.
      # GPU builds (including PTX-only builds) are manual and local, never CI.
      - name: Compile CUDA-independent production libraries
        run: |
          set -euo pipefail
          cargo check --locked --lib \
            -p xlog-core -p xlog-ir -p xlog-stats -p xlog-logic -p xlog-neural
