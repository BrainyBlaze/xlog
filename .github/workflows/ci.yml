name: ci

# Local validation:
#   make lint-workflows  # actionlint + shellcheck for workflow YAML and embedded bash
#   make lint-shell      # shellcheck for repo shell scripts
#   make check-tracked-ignored  # tracked files must not match .gitignore

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  production-build:
    name: production-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: nvidia/cuda:13.1.1-devel-ubuntu22.04
    defaults:
      run:
        shell: bash
    env:
      CARGO_HOME: /github/home/.cargo
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      # Compile real portable PTX; architecture-specific release cubins belong
      # to the separately qualified artifact build, not this source gate.
      XLOG_NO_CUBIN: "1"
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            git \
            pkg-config \
            python3 \
            python3-dev \
            ripgrep \
            shellcheck \
            zstd

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        id: rust
        run: |
          bash scripts/install_rust_toolchain.sh --toolchain stable --component rustfmt
          printf 'version=%s\n' "$(rustc --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /github/home/.cargo/registry
            /github/home/.cargo/git
            target
          key: production-build-${{ runner.os }}-cuda13.1.1-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            production-build-${{ runner.os }}-cuda13.1.1-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}-

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.7
        run: |
          set -euo pipefail
          actionlint_archive=$(mktemp)
          curl --fail --show-error --location \
            --retry 3 \
            --retry-all-errors \
            --output "$actionlint_archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -tzf "$actionlint_archive" actionlint >/dev/null
          tar -xzf "$actionlint_archive" -C /usr/local/bin actionlint

      - name: Check source formatting, workflows and shell scripts
        run: |
          set -euo pipefail
          cargo fmt --all --check
          actionlint -color
          mapfile -t files < <(rg --files scripts .github -g '*.sh')
          if ((${#files[@]})); then
            shellcheck "${files[@]}"
          fi
          ignored=$(git -c safe.directory="$GITHUB_WORKSPACE" ls-files -ci --exclude-standard)
          if [[ -n "$ignored" ]]; then
            printf 'Tracked files match ignore rules:\n%s\n' "$ignored" >&2
            exit 1
          fi

      - name: Compile production libraries and binaries once
        env:
          # Policy material supplied by the artifact owner is required for the
          # semantic-policy build. This gate covers self-contained source only.
          XLOG_BUILD_FEATURES: >-
            xlog-cuda/arrow-device-import
            xlog-cuda/wcoj-phase-timing
            xlog-runtime/recursive-stats-trace
            xlog-runtime/wcoj-phase-timing
            xlog-prob/host-io
            pyxlog/arrow-device-import
            pyxlog/extension-module
            pyxlog/host-io
            xlog-neural/pyo3
            xlog-neural/python
            xlog-integration/wcoj-phase-timing
            xlog-cli/host-io
        run: |
          set -euo pipefail
          nvcc --version
          time cargo check --workspace --lib --bins --locked --features "$XLOG_BUILD_FEATURES"
