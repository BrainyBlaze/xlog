name: Manual CPU fuzzing

on:
  workflow_dispatch:
    inputs:
      target:
        description: Parser/compiler fuzz target
        type: choice
        options: [fuzz_parser, fuzz_compiler, fuzz_type_inference]
        default: fuzz_parser
      duration:
        description: Fuzzing duration in seconds
        type: choice
        options: ["60", "300"]
        default: "60"

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "2"
      FUZZ_TARGET: ${{ inputs.target }}
      FUZZ_DURATION: ${{ inputs.duration }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Validate bounded manual inputs
        run: |
          set -euo pipefail
          case "$FUZZ_TARGET" in
            fuzz_parser|fuzz_compiler|fuzz_type_inference) ;;
            *) echo "Unsupported fuzz target" >&2; exit 1 ;;
          esac
          case "$FUZZ_DURATION" in
            60|300) ;;
            *) echo "Duration must be 60 or 300 seconds" >&2; exit 1 ;;
          esac

      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly

      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: fuzz/corpus/${{ inputs.target }}
          key: fuzz-corpus-${{ inputs.target }}-${{ github.sha }}
          restore-keys: |
            fuzz-corpus-${{ inputs.target }}-

      - name: Run selected target with AddressSanitizer
        id: fuzzer
        working-directory: fuzz
        run: |
          set -euo pipefail
          mkdir -p "corpus/$FUZZ_TARGET"
          cargo +nightly fuzz run "$FUZZ_TARGET" --sanitizer address -- \
            -max_total_time="$FUZZ_DURATION" -max_len=4096 -rss_limit_mb=1024

      - name: Upload actual crash reproducers
        if: failure() && steps.fuzzer.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-crashes-${{ inputs.target }}
          path: fuzz/artifacts/
          retention-days: 7

      - name: Upload completed corpus
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-corpus-${{ inputs.target }}
          path: fuzz/corpus/${{ inputs.target }}/
          if-no-files-found: error
          retention-days: 7
