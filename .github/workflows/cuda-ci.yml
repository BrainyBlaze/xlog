name: cuda-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full commit SHA reviewed for execution on the persistent CUDA runner
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cuda-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XLOG_REQUIRE_CUDA: "1"
  TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.reviewed_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  cuda-changes:
    name: cuda-changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.classify.outputs.relevant }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Classify CUDA Python-wheel changes
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ env.TARGET_SHA }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch)
              relevant=true
              ;;
            pull_request)
              relevant=$(git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" | \
                python3 scripts/cuda_ci.py classify --null)
              ;;
            push)
              if [[ "$BEFORE_SHA" =~ ^0{40}$ ]]; then
                relevant=true
              else
                relevant=$(git diff --no-renames --name-only -z "$BEFORE_SHA" "$HEAD_SHA" | \
                  python3 scripts/cuda_ci.py classify --null)
              fi
              ;;
            *)
              echo "Unsupported event for CUDA change classification: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          if [[ "$relevant" != "true" && "$relevant" != "false" ]]; then
            echo "Classifier returned invalid result: $relevant" >&2
            exit 1
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  rust-tests:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, cuda]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Verify the exact checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "TARGET_SHA must be a full lowercase commit SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Cargo test (release)
        run: RUST_TEST_THREADS=1 cargo test --workspace --all-targets --release

  python-wheel-gpu:
    name: python-wheel-gpu
    needs: cuda-changes
    if: >-
      needs.cuda-changes.result == 'success' &&
      needs.cuda-changes.outputs.relevant == 'true' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, linux, x64, cuda]
    timeout-minutes: 90
    env:
      PINNED_CORPUS_SHA: 74f2895486737b4caa42229389d309994e7ad3ea
      PINNED_CORPUS_ROOT: ${{ github.workspace }}/.ci/pinned-resident-corpus
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Verify the exact checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "TARGET_SHA must be a full lowercase commit SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
      - name: Create isolated Python environment
        run: |
          python_env="$RUNNER_TEMP/xlog-python-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python -m venv "$python_env"
          echo "$python_env/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip -c python/constraints-build.txt maturin pytest pytest-timeout torch
      - name: Require CUDA from the configured Python runtime
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi -L
          python - <<'PY'
          import torch

          if not torch.cuda.is_available():
              raise RuntimeError("XLOG_REQUIRE_CUDA=1 but PyTorch cannot access CUDA")
          print("torch version:", torch.__version__)
          print("torch CUDA:", torch.version.cuda)
          print("GPU:", torch.cuda.get_device_name(0))
          PY
      - name: Build and reproduce exact wheel
        id: build-wheel
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH="$(git -c safe.directory="$GITHUB_WORKSPACE" show -s --format=%ct HEAD)"
          wheel_dir="$RUNNER_TEMP/pyxlog-wheel-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$wheel_dir"
          find "$wheel_dir" -maxdepth 1 -type f -name 'pyxlog-*.whl' -delete
          python scripts/validate_reproducible_pyxlog_wheel.py \
            --out-dir "$wheel_dir" \
            --compatibility manylinux_2_34
          mapfile -t wheels < <(find "$wheel_dir" -maxdepth 1 -type f -name 'pyxlog-*.whl')
          if ((${#wheels[@]} != 1)); then
            echo "expected one pyxlog wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          echo "wheel=${wheels[0]}" >> "$GITHUB_OUTPUT"
      - name: Install exact wheel
        run: python -m pip install --force-reinstall --no-deps "${{ steps.build-wheel.outputs.wheel }}"
      - name: Report native module provenance
        run: python -c 'import pathlib, pyxlog; print(pathlib.Path(pyxlog._native.__file__).resolve())'
      - name: Run installed pyxlog contract tests
        run: |
          mkdir -p test-results
          python -m pytest -q \
            python/tests/test_logic_relation_provenance.py \
            python/tests/test_pyxlog_epistemic_api.py \
            python/tests/test_pyxlog_epistemic_gpu.py \
            python/tests/test_pyxlog_ground_term_encoding.py \
            python/tests/test_relation_provenance_contract.py \
            python/tests/test_relation_provenance_public_api.py \
            python/tests/test_relation_callbacks_runtime.py \
            --timeout=300 \
            --junitxml=test-results/installed-pyxlog-contracts.xml
      - name: Run reusable conditioned Python tests without skips
        shell: bash
        run: |
          set -euo pipefail
          result_file="$RUNNER_TEMP/pyxlog-conditioned-reuse-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          python -m pytest -q \
            python/tests/test_pyxlog_conditioned_reuse.py \
            --timeout=300 2>&1 | tee "$result_file"
          python - "$result_file" <<'PY'
          import pathlib
          import re
          import sys

          output = pathlib.Path(sys.argv[1]).read_text()
          passed = sum(int(count) for count in re.findall(r"(\d+) passed", output))
          skipped = sum(int(count) for count in re.findall(r"(\d+) skipped", output))
          if passed == 0 or skipped != 0:
              raise SystemExit(
                  f"conditioned reuse tests require nonzero passes and zero skips; "
                  f"got passed={passed} skipped={skipped}"
              )
          PY
      - name: Run membership-mask transfer tests
        run: cargo test -p xlog-cuda --test test_membership_mask --release -- --nocapture
      - name: Require pinned corpus automation token
        shell: bash
        env:
          PINNED_CORPUS_TOKEN: ${{ secrets.RELEASE_PLZ_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$PINNED_CORPUS_TOKEN" ]] || {
            echo "RELEASE_PLZ_GITHUB_TOKEN must be able to read the pinned acceptance corpus" >&2
            exit 1
          }
      - name: Check out pinned resident acceptance corpus
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: BrainyBlaze/mistaber-xlog
          ref: ${{ env.PINNED_CORPUS_SHA }}
          token: ${{ secrets.RELEASE_PLZ_GITHUB_TOKEN }}
          persist-credentials: false
          path: .ci/pinned-resident-corpus
          fetch-depth: 1
          submodules: recursive
      - name: Run exact resident graph CUDA acceptance gates
        shell: bash
        run: |
          set -euo pipefail
          scratch_dir=$(mktemp -d "${RUNNER_TEMP:?}/xlog-pinned-corpus.XXXXXX")
          cleanup() {
            if [[ -d "$scratch_dir" && "$scratch_dir" == "$RUNNER_TEMP"/xlog-pinned-corpus.* ]]; then
              rm -rf -- "$scratch_dir"
            fi
          }
          trap cleanup EXIT

          gate_index=0
          run_exact_gate() {
            local label="$1"
            local expected_passed="$2"
            shift 2
            gate_index=$((gate_index + 1))
            local log_file="$scratch_dir/gate-$gate_index.log"
            local cargo_status
            local tee_status
            local -a pipeline_status

            printf '+'
            printf ' %q' "$@"
            printf '\n'
            set +e
            "$@" 2>&1 | tee "$log_file"
            pipeline_status=("${PIPESTATUS[@]}")
            set -e
            cargo_status="${pipeline_status[0]}"
            tee_status="${pipeline_status[1]}"

            local parser_status=0
            python - "$log_file" "$cargo_status" "$tee_status" "$expected_passed" "$label" <<'PY' || parser_status=$?
          import pathlib
          import re
          import sys

          output = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          cargo_status = int(sys.argv[2])
          tee_status = int(sys.argv[3])
          expected_passed = int(sys.argv[4])
          label = sys.argv[5]
          summary_lines = re.findall(r"(?im)^\s*test result:.*$", output)
          summary = None
          if len(summary_lines) == 1:
              summary = re.search(
                  r"test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; "
                  r"(\d+) ignored; (\d+) measured; (\d+) filtered out",
                  summary_lines[0],
              )
          problems = []
          if cargo_status != 0:
              problems.append(f"cargo test exited with status {cargo_status}")
          if tee_status != 0:
              problems.append(f"tee exited with status {tee_status}")
          if len(summary_lines) != 1:
              problems.append(
                  f"expected one Rust test summary, found {len(summary_lines)}"
              )
          elif summary is None:
              problems.append("Rust test summary did not match the expected format")
          else:
              status, passed, failed, ignored, measured, _filtered = summary.groups()
              actual = tuple(map(int, (passed, failed, ignored, measured)))
              expected = (expected_passed, 0, 0, 0)
              if status != "ok" or actual != expected:
                  problems.append(
                      "expected "
                      f"{expected_passed} passed; 0 failed; 0 ignored; 0 measured, "
                      f"got {passed} passed; {failed} failed; {ignored} ignored; "
                      f"{measured} measured with status {status}"
                  )
          skipped = len(re.findall(r"(?im)^\s*Skipping test:", output))
          if skipped:
              problems.append(f"{skipped} tests skipped CUDA execution")
          if problems:
              raise SystemExit(f"{label}: " + "; ".join(problems))
          print(
              f"{label}: exact Rust summary {expected_passed} passed; "
              "0 failed; 0 ignored; 0 measured"
          )
          PY
            rm -f "$log_file"
            return "$parser_status"
          }

          run_exact_gate "resident graph runtime module" 22 \
            cargo test --locked --release -p xlog-runtime --lib \
            --features resident-graph-tests \
            executor::resident_graph_tests -- \
            --nocapture --test-threads=1

          corpus_root="$PINNED_CORPUS_ROOT"
          test -d "$corpus_root/.git"
          test "$(git -C "$corpus_root" rev-parse HEAD)" = "$PINNED_CORPUS_SHA"

          test -z "$(git -C "$corpus_root" status --porcelain=v1 --untracked-files=all)"
          git -C "$corpus_root" diff --quiet --no-ext-diff --submodule=diff
          git -C "$corpus_root" diff --cached --quiet --no-ext-diff --submodule=diff
          submodule_status=$(git -C "$corpus_root" submodule status --recursive)
          while IFS= read -r line; do
            if [[ -n "$line" && "${line:0:1}" != " " ]]; then
              echo "submodule is not initialized at its recorded commit: $line" >&2
              exit 1
            fi
          done <<< "$submodule_status"
          git -C "$corpus_root" submodule foreach --quiet --recursive \
            "test -z \"\$(git status --porcelain=v1 --untracked-files=all)\""

          export XLOG_PINNED_CORPUS_ROOT="$corpus_root"

          run_exact_gate "pinned corpus prepare-only" 1 \
            cargo test --locked --release -p xlog-gpu --lib \
            logic::tests::pinned_corpus_prepares_resident_graph_without_launching_it -- \
            --ignored --exact --nocapture --test-threads=1

          run_exact_gate "pinned corpus production launch" 1 \
            cargo test --locked --release -p xlog-gpu --lib \
            logic::tests::pinned_corpus_certifies_and_runs_through_the_resident_production_path -- \
            --ignored --exact --nocapture --test-threads=1

          run_exact_gate "disconnected-rule scaling acceptance" 1 \
            cargo test --locked --release -p xlog-gpu --lib \
            logic::tests::resident_disconnected_four_thousand_rule_scaling_acceptance -- \
            --ignored --exact --nocapture --test-threads=1

          run_exact_gate "resident semantic acceptance matrix" 1 \
            cargo test --locked --release -p xlog-gpu --lib \
            logic::tests::resident_semantic_acceptance_matrix -- \
            --ignored --exact --nocapture --test-threads=1
      - name: Run host-IO probabilistic CLI tests
        run: cargo test --locked --release -p xlog-cli --features host-io --test prob_cli_tests -- --nocapture --test-threads=1
      - name: Run predicate-function CLI tests
        run: cargo test --locked --release -p xlog-cli --test predicate_function_cli_tests -- --nocapture --test-threads=1
      - name: Run explain CLI tests
        run: cargo test --locked --release -p xlog-cli --test explain_cli_tests -- --nocapture --test-threads=1
      - name: Run accepted epistemic probability adapter tests
        run: cargo test --locked --release -p xlog-prob --features host-io --test epistemic_prob_gpu_accepted_evidence --test epistemic_prob_production_reuse -- --nocapture --test-threads=1
      - name: Run reusable conditioned Rust integration tests without skips
        shell: bash
        run: |
          set -euo pipefail
          result_file="$RUNNER_TEMP/xlog-prob-conditioned-reuse-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          cargo test --locked --release -p xlog-prob --features host-io \
            --test conditioned_program_reuse -- --nocapture --test-threads=1 \
            2>&1 | tee "$result_file"
          python - "$result_file" <<'PY'
          import pathlib
          import re
          import sys

          output = pathlib.Path(sys.argv[1]).read_text()
          summaries = re.findall(
              r"test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored;",
              output,
          )
          if not summaries:
              raise SystemExit("conditioned reuse integration emitted no test summary")
          passed = sum(int(summary[0]) for summary in summaries)
          failed = sum(int(summary[1]) for summary in summaries)
          ignored = sum(int(summary[2]) for summary in summaries)
          if passed == 0 or failed != 0 or ignored != 0:
              raise SystemExit(
                  f"conditioned reuse integration requires nonzero passes and zero "
                  f"failures/skips; got passed={passed} failed={failed} ignored={ignored}"
              )
          PY
      - name: Run host-IO probabilistic library tests without skips
        shell: bash
        run: |
          set -euo pipefail
          result_file="$RUNNER_TEMP/xlog-prob-host-io-lib-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          cargo test --locked --release -p xlog-prob --features host-io --lib \
            -- --nocapture --test-threads=1 2>&1 | tee "$result_file"
          python - "$result_file" <<'PY'
          import pathlib
          import re
          import sys

          output = pathlib.Path(sys.argv[1]).read_text()
          summaries = re.findall(
              r"test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored;",
              output,
          )
          if not summaries:
              raise SystemExit("host-IO library tests emitted no test summary")
          passed = sum(int(summary[0]) for summary in summaries)
          failed = sum(int(summary[1]) for summary in summaries)
          ignored = sum(int(summary[2]) for summary in summaries)
          if passed == 0 or failed != 0 or ignored != 0:
              raise SystemExit(
                  f"host-IO library tests require nonzero passes and zero "
                  f"failures/skips; got passed={passed} failed={failed} ignored={ignored}"
              )
          PY
      - name: Smoke test import + evaluate
        shell: bash
        run: |
          python - <<'PY'
          import pyxlog
          print("pyxlog version:", pyxlog.__version__)

          logic_src = r"""
          pred edge(i64, i64).
          pred reach(i64, i64).

          edge(1, 2).
          edge(2, 3).

          reach(X, Y) :- edge(X, Y).
          reach(X, Z) :- reach(X, Y), edge(Y, Z).

          ?- reach(X, Y).
          """.strip()

          logic = pyxlog.LogicProgram.compile(logic_src, device=0, memory_mb=1024)
          logic_res = logic.evaluate()
          assert len(logic_res.queries) == 1

          prob_src = r"""
          0.7::rain().
          0.2::sprinkler().
          wet() :- rain().
          wet() :- sprinkler().
          evidence(wet(), true).
          query(rain()).
          query(sprinkler()).
          """.strip()

          prob = pyxlog.Program.compile(prob_src, device=0, memory_mb=1024)
          prob_res = prob.evaluate(return_grads=False)
          assert len(prob_res.atoms) == 2

          # MC stage 1: a monotone program must run on the resident
          # GPU engine and carry the "gpu-resident" label.
          mc_monotone_src = r"""
          #pragma prob_engine = mc

          0.7::rain().
          0.2::sprinkler().

          wet() :- rain().
          wet() :- sprinkler().

          query(wet()).
          query(rain()).
          """.strip()

          mc = pyxlog.Program.compile(mc_monotone_src, device=0, memory_mb=1024)
          mc_res = mc.evaluate(return_grads=False, samples=20000, seed=123, confidence=0.95)
          assert mc_res.mc_engine == "gpu-resident", mc_res.mc_engine
          assert len(mc_res.atoms) == 2
          assert mc_res.approx is True
          assert mc_res.stderr is not None
          assert mc_res.ci_low is not None
          assert mc_res.ci_high is not None
          assert mc_res.samples == 20000

          mc_nonmonotone_src = r"""
          #pragma prob_engine = mc

          0.5::flip().

          p() :- flip().
          q() :- not p().
          p() :- not q().

          query(p()).
          query(flip()).
          """.strip()

          # MC stage 2: negation is resident-rejected, so the default
          # configuration must fail closed with the typed rejection —
          # assert the exact reason, not just "it raised".
          mc_rej = pyxlog.Program.compile(mc_nonmonotone_src, device=0, memory_mb=1024)
          try:
              mc_rej.evaluate(return_grads=False, samples=20000, seed=123, confidence=0.95, max_nonmonotone_iterations=256)
          except RuntimeError as e:
              msg = str(e)
              assert "resident MC engine rejected program" in msg, msg
              assert "kind=negation" in msg, msg
          else:
              raise AssertionError("non-monotone MC program must fail closed without allow_cpu_oracle")

          # MC stage 3: the explicit opt-in must run the labeled CPU
          # oracle and still produce the full MC result surface.
          mc_oracle = pyxlog.Program.compile(mc_nonmonotone_src, device=0, memory_mb=1024)
          mc_oracle_res = mc_oracle.evaluate(return_grads=False, samples=20000, seed=123, confidence=0.95, max_nonmonotone_iterations=256, allow_cpu_oracle=True)
          assert mc_oracle_res.mc_engine == "cpu-oracle", mc_oracle_res.mc_engine
          assert len(mc_oracle_res.atoms) == 2
          assert mc_oracle_res.approx is True
          assert mc_oracle_res.stderr is not None
          assert mc_oracle_res.ci_low is not None
          assert mc_oracle_res.ci_high is not None
          assert mc_oracle_res.samples == 20000
          PY
      - name: Upload provenance test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: relation-provenance-test-report
          path: test-results/relation-provenance.xml
          if-no-files-found: warn

  python-wheel:
    name: python-wheel
    needs: [cuda-changes, python-wheel-gpu]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Enforce the stable Python-wheel result
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          RELEVANT: ${{ needs.cuda-changes.outputs.relevant }}
          CLASSIFICATION_RESULT: ${{ needs.cuda-changes.result }}
          GPU_RESULT: ${{ needs.python-wheel-gpu.result }}
        run: |
          set -euo pipefail
          python3 scripts/cuda_ci.py aggregate \
            --event-name "$EVENT_NAME" \
            --repository "$REPOSITORY" \
            --head-repository "$HEAD_REPOSITORY" \
            --relevant "$RELEVANT" \
            --classification-result "$CLASSIFICATION_RESULT" \
            --gpu-result "$GPU_RESULT"
