name: cuda-ci

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cuda-ci.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "python/tests/conftest.py"
      - "python/tests/test_logic_relation_provenance.py"
      - "python/tests/test_pyxlog_epistemic_api.py"
      - "python/tests/test_pyxlog_epistemic_gpu.py"
      - "python/tests/test_relation_callbacks_runtime.py"
      - "python/tests/test_relation_provenance_contract.py"
      - "python/tests/test_relation_provenance_public_api.py"
      - "scripts/validate_release_gpu.sh"
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full commit SHA reviewed for execution on the persistent CUDA runner
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cuda-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XLOG_REQUIRE_CUDA: "1"
  TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.reviewed_sha || github.sha }}

jobs:
  rust-tests:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, cuda]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Verify the reviewed commit
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "reviewed_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Cargo test (release)
        run: cargo test --workspace --all-targets --release

  python-wheel:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, linux, x64, cuda]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Verify the reviewed commit
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "reviewed_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
      - name: Create isolated Python environment
        run: |
          python_env="$RUNNER_TEMP/xlog-python-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python -m venv "$python_env"
          echo "$python_env/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip maturin pytest pytest-timeout torch
      - name: Require CUDA from the configured Python runtime
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi -L
          python - <<'PY'
          import torch

          if not torch.cuda.is_available():
              raise RuntimeError("XLOG_REQUIRE_CUDA=1 but PyTorch cannot access CUDA")
          print("torch version:", torch.__version__)
          print("torch CUDA:", torch.version.cuda)
          print("GPU:", torch.cuda.get_device_name(0))
          PY
      - name: Build exact wheel
        id: build-wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel_dir="$RUNNER_TEMP/pyxlog-wheel-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$wheel_dir"
          find "$wheel_dir" -maxdepth 1 -type f -name 'pyxlog-*.whl' -delete
          maturin build \
            --manifest-path crates/pyxlog/Cargo.toml \
            --release \
            --locked \
            --out "$wheel_dir"
          mapfile -t wheels < <(find "$wheel_dir" -maxdepth 1 -type f -name 'pyxlog-*.whl')
          if ((${#wheels[@]} != 1)); then
            echo "expected one pyxlog wheel, found ${#wheels[@]}" >&2
            exit 1
          fi
          echo "wheel=${wheels[0]}" >> "$GITHUB_OUTPUT"
      - name: Install exact wheel
        run: python -m pip install --force-reinstall --no-deps "${{ steps.build-wheel.outputs.wheel }}"
      - name: Report native module provenance
        run: python -c 'import pathlib, pyxlog; print(pathlib.Path(pyxlog._native.__file__).resolve())'
      - name: Run native relation provenance tests
        run: |
          mkdir -p test-results
          python -m pytest -q \
            python/tests/test_logic_relation_provenance.py \
            python/tests/test_pyxlog_epistemic_api.py \
            python/tests/test_pyxlog_epistemic_gpu.py \
            python/tests/test_relation_provenance_contract.py \
            python/tests/test_relation_provenance_public_api.py \
            python/tests/test_relation_callbacks_runtime.py \
            --timeout=300 \
            --junitxml=test-results/relation-provenance.xml
      - name: Run membership-mask transfer tests
        run: cargo test -p xlog-cuda --test test_membership_mask --release -- --nocapture
      - name: Run host-IO probabilistic CLI tests
        run: cargo test --locked --release -p xlog-cli --features host-io --test prob_cli_tests -- --nocapture --test-threads=1
      - name: Run accepted epistemic probability adapter tests
        run: cargo test --locked --release -p xlog-prob --features host-io --test epistemic_prob_gpu_accepted_evidence --test epistemic_prob_production_reuse -- --nocapture --test-threads=1
      - name: Smoke test import + evaluate
        shell: bash
        run: |
          python - <<'PY'
          import pyxlog
          print("pyxlog version:", pyxlog.__version__)

          logic_src = r"""
          pred edge(i64, i64).
          pred reach(i64, i64).

          edge(1, 2).
          edge(2, 3).

          reach(X, Y) :- edge(X, Y).
          reach(X, Z) :- reach(X, Y), edge(Y, Z).

          ?- reach(X, Y).
          """.strip()

          logic = pyxlog.LogicProgram.compile(logic_src, device=0, memory_mb=1024)
          logic_res = logic.evaluate()
          assert len(logic_res.queries) == 1

          prob_src = r"""
          0.7::rain().
          0.2::sprinkler().
          wet() :- rain().
          wet() :- sprinkler().
          evidence(wet(), true).
          query(rain()).
          query(sprinkler()).
          """.strip()

          prob = pyxlog.Program.compile(prob_src, device=0, memory_mb=1024)
          prob_res = prob.evaluate(return_grads=False)
          assert len(prob_res.atoms) == 2

          # MC stage 1: a monotone program must run on the resident
          # GPU engine and carry the "gpu-resident" label.
          mc_monotone_src = r"""
          #pragma prob_engine = mc

          0.7::rain().
          0.2::sprinkler().

          wet() :- rain().
          wet() :- sprinkler().

          query(wet()).
          query(rain()).
          """.strip()

          mc = pyxlog.Program.compile(mc_monotone_src, device=0, memory_mb=1024)
          mc_res = mc.evaluate(return_grads=False, samples=20000, seed=123, confidence=0.95)
          assert mc_res.mc_engine == "gpu-resident", mc_res.mc_engine
          assert len(mc_res.atoms) == 2
          assert mc_res.approx is True
          assert mc_res.stderr is not None
          assert mc_res.ci_low is not None
          assert mc_res.ci_high is not None
          assert mc_res.samples == 20000

          mc_nonmonotone_src = r"""
          #pragma prob_engine = mc

          0.5::flip().

          p() :- flip().
          q() :- not p().
          p() :- not q().

          query(p()).
          query(flip()).
          """.strip()

          # MC stage 2: negation is resident-rejected, so the default
          # configuration must fail closed with the typed rejection —
          # assert the exact reason, not just "it raised".
          mc_rej = pyxlog.Program.compile(mc_nonmonotone_src, device=0, memory_mb=1024)
          try:
              mc_rej.evaluate(return_grads=False, samples=20000, seed=123, confidence=0.95, max_nonmonotone_iterations=256)
          except RuntimeError as e:
              msg = str(e)
              assert "resident MC engine rejected program" in msg, msg
              assert "kind=negation" in msg, msg
          else:
              raise AssertionError("non-monotone MC program must fail closed without allow_cpu_oracle")

          # MC stage 3: the explicit opt-in must run the labeled CPU
          # oracle and still produce the full MC result surface.
          mc_oracle = pyxlog.Program.compile(mc_nonmonotone_src, device=0, memory_mb=1024)
          mc_oracle_res = mc_oracle.evaluate(return_grads=False, samples=20000, seed=123, confidence=0.95, max_nonmonotone_iterations=256, allow_cpu_oracle=True)
          assert mc_oracle_res.mc_engine == "cpu-oracle", mc_oracle_res.mc_engine
          assert len(mc_oracle_res.atoms) == 2
          assert mc_oracle_res.approx is True
          assert mc_oracle_res.stderr is not None
          assert mc_oracle_res.ci_low is not None
          assert mc_oracle_res.ci_high is not None
          assert mc_oracle_res.samples == 20000
          PY
      - name: Upload provenance test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: relation-provenance-test-report
          path: test-results/relation-provenance.xml
          if-no-files-found: warn
