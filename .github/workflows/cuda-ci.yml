name: cuda-ci

# Build an exact wheel only when requested. Runtime qualification belongs to
# the separately authorized RunPod production path, not component CI tests.
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full commit SHA reviewed for the wheel artifact build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cuda-ci-${{ inputs.reviewed_sha }}
  cancel-in-progress: true

env:
  TARGET_SHA: ${{ inputs.reviewed_sha }}

jobs:
  python-wheel:
    name: python-wheel
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, cuda]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Verify the exact checked-out commit
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "TARGET_SHA must be a full lowercase commit SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
      - name: Create isolated Python environment
        run: |
          set -euo pipefail
          python_env="$RUNNER_TEMP/xlog-python-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python -m venv "$python_env"
          echo "$python_env/bin" >> "$GITHUB_PATH"
      - name: Install Rust toolchain
        run: bash scripts/install_rust_toolchain.sh --toolchain stable
      - name: Install wheel build dependencies
        run: python -m pip install --upgrade pip -c python/constraints-build.txt maturin
      - name: Build and reproduce exact wheel
        id: build-wheel
        run: |
          set -euo pipefail
          nvcc --version
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH="$(git -c safe.directory="$GITHUB_WORKSPACE" show -s --format=%ct HEAD)"
          wheel_dir=$(mktemp -d "$RUNNER_TEMP/pyxlog-wheel.XXXXXX")
          python scripts/validate_reproducible_pyxlog_wheel.py \
            --out-dir "$wheel_dir" \
            --compatibility manylinux_2_34 2>&1 | tee "$wheel_dir/build.log"
          echo "directory=$wheel_dir" >> "$GITHUB_OUTPUT"
      - name: Upload exact wheel and reproducibility log
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pyxlog-wheel-${{ env.TARGET_SHA }}
          path: ${{ steps.build-wheel.outputs.directory }}
          if-no-files-found: error
