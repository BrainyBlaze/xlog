[workspace]
release = false
release_always = false
dependencies_update = false
changelog_path = "CHANGELOG.md"
max_analyze_commits = 5000
pr_branch_prefix = "release-plz-"
pr_labels = ["release"]
# Release worthiness is enforced as ONE workspace-level gate in
# .github/workflows/release-plz.yml, not per package: a per-package
# `release_commits` filter over a shared [workspace.package].version
# produces a partial release set, and a minor bump then breaks the
# excluded crates' `^x.y.z` workspace-dependency requirements inside
# release-plz's own cargo update.
git_release_enable = false
git_tag_enable = false

[[package]]
name = "xlog-core"
release = true
version_group = "xlog"

[[package]]
name = "xlog-ir"
release = true
version_group = "xlog"

[[package]]
name = "xlog-cuda"
release = true
version_group = "xlog"

[[package]]
name = "xlog-stats"
release = true
version_group = "xlog"

[[package]]
name = "xlog-runtime"
release = true
version_group = "xlog"

[[package]]
name = "xlog-logic"
release = true
version_group = "xlog"

[[package]]
name = "xlog-solve"
release = true
version_group = "xlog"

[[package]]
name = "xlog-gpu"
release = true
version_group = "xlog"

[[package]]
name = "xlog-prob"
release = true
version_group = "xlog"

[[package]]
name = "xlog-cli"
release = true
version_group = "xlog"
publish_features = ["host-io"]
git_release_enable = true
git_tag_enable = true
git_tag_name = "xlog-cli-v{{ version }}"
git_release_name = "xlog-cli v{{ version }}"
# The shared workspace CHANGELOG.md contains one "## [x.y.z]" heading per crate
# in the version group, which can leave "{{ changelog }}" empty at release time.
# Keep the install/docs footer so the GitHub release body is never blank.
git_release_body = """
{{ changelog }}

---

**Install**: `cargo install xlog-cli --features host-io` · `pip install pyxlog` · [release archives](https://github.com/BrainyBlaze/xlog/releases)
**Docs**: https://xlog.md · **Full changelog**: [CHANGELOG.md](https://github.com/BrainyBlaze/xlog/blob/main/CHANGELOG.md)
"""

[[package]]
name = "pyxlog"
release = true
version_group = "xlog"
publish = false
git_only = true
changelog_update = false

[[package]]
name = "xlog-neural"
release = true
version_group = "xlog"
publish = false
git_only = true
changelog_update = false

[[package]]
name = "xlog-induce"
release = true
version_group = "xlog"
publish = false
git_only = true
changelog_update = false
